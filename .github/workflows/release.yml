# Выпуск новой версии: git tag v1.2.3 && git push origin v1.2.3
# Собирает Tilashar.exe (его скачивает «Автообновление») и установщик
# Tilashar-Setup.exe и выкладывает оба в GitHub Releases.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Версия из тега
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          Set-Content -Path version.py -Encoding utf8NoBOM -Value "VERSION = `"$v`""

      - name: Тесты
        env:
          PYTHONIOENCODING: utf-8
        run: python tests.py

      - name: Сборка exe
        run: |
          python -m pip install pyinstaller==6.21.0
          python -m PyInstaller --noconfirm tilashar.spec

      - name: Установщик
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\is.exe"
          Start-Process "$env:RUNNER_TEMP\is.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/DIR=C:\inno' -Wait
          & C:\inno\ISCC.exe "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" installer/tilashar.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Tilashar.exe
            dist/Tilashar-Setup.exe
          generate_release_notes: true
